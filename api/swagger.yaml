            - properties:
                data:
                  $ref: '#/definitions/services_payments_internal_api.checkoutSessionResponse'
              type: object
        "400":
          description: VALIDATION_FAILED
          schema:
            allOf:
            - $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/bakehouse_pkg_httpx.ErrorBody'
              type: object
        "503":
          description: PAYMENTS_NOT_CONFIGURED or STRIPE_ERROR
          schema:
            allOf:
            - $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
            - properties:
