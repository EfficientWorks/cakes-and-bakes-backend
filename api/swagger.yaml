        for pickup/takeaway; a paid order becomes fulfilled) · delivered (requires
        payment captured; order → fulfilled) · packing / ready_for_delivery · recall
        (handed over → ready) · undo. Writes the kitchen timeline and, where the order
        status changes, the status timeline.
