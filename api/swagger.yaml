  /storefront/coupons:
    get:
      description: 'Active codes only. Filters: branchId keeps network-wide codes
        plus that branch''s own; showOnCheckout=true keeps codes flagged for the checkout
        page; newCustomer=true/false keeps only first-order codes / everything else;
        date (YYYY-MM-DD) keeps codes whose window covers that day (codes with no
        window always match). With a customer bearer token, each new-customer code
        says whether that customer can still use it (eligible / ineligibleReason).'
      parameters:
      - description: Branch id
        in: query
        name: branchId
        type: string
      - description: Only codes flagged for the checkout page
        in: query
        name: showOnCheckout
        type: boolean
      - description: 'true: only new-customer codes; false: exclude them'
        in: query
        name: newCustomer
        type: boolean
      - description: YYYY-MM-DD; keep codes valid on that day
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
      summary: List discount codes the storefront may show
      tags:
      - storefront
  /storefront/events:
    get:
      description: 'text/event-stream. Public: catalog.product.changed, catalog.category.changed,
        catalog.modifier.changed, catalog.coupon.changed, catalog.content.changed,
        catalog.availability.changed (data: {action, id}). With a customer access
        token (?accessToken=), also order.created, order.updated, order.status_changed,
        order.amended, order.cancelled for that customer''s orders (data: {orderId,
        reference, status}). A "ready" event opens the stream ({"signedIn": true|false});
        a ": ping" comment every 25 s.'
      parameters:
      - description: Customer access token (optional)
        in: query
        name: accessToken
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: event stream
          schema:
            type: string
      summary: Website live updates (Server-Sent Events)
      tags:
      - storefront
  /storefront/orders:
    post:
      consumes:
      - application/json
      description: Places the order from the current cart. Optional `status` selects
        the status the order lands in (placed, confirmed, scheduled, in_production,
        ready, out_for_delivery, fulfilled); omitted = placed then auto-accepted as
        confirmed. Optional `startTime` (alias `placedAt`) and `endTime` are RFC3339
        date-times from the client's clock, stored as the order's start_time / end_time;
        end_time is kept only when the order lands in a closing status.
      parameters:
      - description: Guest cart token; omit when authenticated
        in: header
        name: X-Cart-Token
        type: string
      - description: Client-generated UUID; replays return the original response
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: 'Request body (status: optional order status, e.g. confirmed
          / scheduled)'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/services_orders_internal_api.createOrderRequest'
      produces:
      - application/json
      responses:
