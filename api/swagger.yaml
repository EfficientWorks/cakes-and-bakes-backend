        name: occasion
        type: string
      - description: Seasonal tag ids (from /storefront/seasonal-tags); repeated or
          comma-separated. Matches ANY
        in: query
        name: tag
        type: string
      - description: Dietary flags; repeated or comma-separated. Matches ALL
        in: query
