  /storefront/recipients:
    get:
      description: Recipients saved for a purchaser, keyed by email. A signed-in customer
        also sees rows saved under their account.
      parameters:
      - description: Purchaser email
        in: query
        name: purchaserEmail
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
      summary: List saved storefront recipients
      tags:
      - storefront
    post:
      consumes:
      - application/json
      description: Adds a recipient to the purchaser's book. Posting an email already
        in the book updates that entry rather than creating a duplicate.
      parameters:
      - description: Purchaser email
        in: query
        name: purchaserEmail
        required: true
        type: string
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/services_orders_internal_api.saveRecipientRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
      summary: Save a recipient
      tags:
      - storefront
  /storefront/recipients/{recipientId}:
    delete:
      parameters:
      - description: recipientId
        in: path
        name: recipientId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
      summary: Delete a saved recipient
      tags:
      - storefront
    get:
      parameters:
      - description: recipientId
        in: path
        name: recipientId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
      summary: Get one saved recipient
      tags:
      - storefront
    put:
      consumes:
      - application/json
      description: 'Full replace by id: every field is written as sent, so an omitted
        address part is cleared. The purchaser email the recipient was saved under
        is kept.'
      parameters:
      - description: recipientId
        in: path
        name: recipientId
        required: true
        type: string
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/services_orders_internal_api.saveRecipientRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "409":
          description: CONFLICT
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
      summary: Update a saved recipient
      tags:
      - storefront
  /storefront/seasonal-tags:
    get:
      description: 'Active tags that have at least one product: the shop filter and
        gift finder chips. Filter products with ?tag=<id>.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/services_catalog_internal_api.seasonalTagDTOType'
                  type: array
              type: object
      summary: Seasonal tags for the storefront
      tags:
      - storefront
  /storefront/slots:
    get:
      description: Slots are cut every 30 minutes from the store's pickup or delivery
        hours. With productId (repeatable) or cart=true, slots inside a seasonal tag's
        restricted dates for those products are left out; unavailableDates lists the
        days that lost every slot to a restriction, restrictions lists the windows.
      parameters:
      - description: Store
        in: query
        name: branchId
        required: true
        type: string
      - description: pickup | delivery
        in: query
        name: fulfilmentType
        required: true
        type: string
      - description: YYYY-MM-DD (default today)
        in: query
        name: startDate
        type: string
      - description: How many days (default 14)
        in: query
        name: days
        type: integer
      - description: Products whose restricted dates apply (repeatable)
        in: query
        name: productId
        type: string
      - description: 'true: the restricted dates of every product in the caller''s
          cart'
        in: query
        name: cart
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
      summary: List bookable delivery or pickup slots
      tags:
      - storefront
  /storefront/zone-coverage-notify:
    post:
      consumes:
      - application/json
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/services_franchise_internal_api.zoneCoverageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
      summary: Register interest in an uncovered postcode
      tags:
      - storefront
  /webhooks/stripe:
    post:
      consumes:
      - application/json
      description: Payment, refund and payment-link updates from Stripe. Verified
        with the Stripe-Signature header against STRIPE_WEBHOOK_SECRET.
      parameters:
      - description: Stripe webhook signature
        in: header
        name: Stripe-Signature
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/services_payments_internal_api.webhookAck'
              type: object
        "401":
          description: INVALID_SIGNATURE
          schema:
            allOf:
            - $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/bakehouse_pkg_httpx.ErrorBody'
              type: object
        "503":
          description: WEBHOOK_NOT_CONFIGURED
          schema:
            allOf:
            - $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/bakehouse_pkg_httpx.ErrorBody'
              type: object
      summary: Stripe webhook
      tags:
      - payments
securityDefinitions:
  BearerAuth:
    description: Bearer access token. Customer and staff are separate realms.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
