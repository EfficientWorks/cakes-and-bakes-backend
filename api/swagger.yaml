basePath: /v1
definitions:
  bakehouse_pkg_apperr.FieldError:
    properties:
      code:
        type: string
      field:
        type: string
      message:
        type: string
    type: object
  bakehouse_pkg_httpx.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/bakehouse_pkg_httpx.ErrorBody'
      meta: {}
      stats: {}
      statusCode:
        description: |-
          StatusCode repeats the HTTP status in the body. Redundant over HTTP,
          and deliberately so: clients that reach the API through something which
          does not hand them the status line — a wrapper that returns only the
          parsed body, a log of a response, a mobile SDK — could otherwise only
          tell 401 from 409 by string-matching the error code.

          Never set by hand. writeEnvelope stamps it from the status actually
          being written, so a body that disagrees with its own status line is not
          something a caller can cause.
        example: 200
        type: integer
      success:
        example: true
        type: boolean
    type: object
  bakehouse_pkg_httpx.ErrorBody:
    properties:
      code:
        example: SLOT_CAPACITY_EXCEEDED
        type: string
      field:
        type: string
      fields:
        items:
          $ref: '#/definitions/bakehouse_pkg_apperr.FieldError'
        type: array
      message:
        example: No remaining capacity for the requested slot
        type: string
      meta:
        additionalProperties: {}
        description: |-
          Meta carries data the client needs to act on the error rather than just
          show it — the 3-D Secure client secret, for one.
        type: object
      requestId:
        type: string
    type: object
  bakehouse_pkg_httpx.Meta:
    properties:
      page:
        example: 1
        type: integer
      per_page:
        example: 50
        type: integer
      total:
        example: 234
        type: integer
      total_pages:
        example: 5
        type: integer
    type: object
  bakehouse_services_admin_adminapi.CreateInvoiceInput:
    properties:
      accountNumber:
        type: string
      bankName:
        type: string
      billedBranchId:
        description: Required when kind is "store" — the outlet being billed.
        type: string
      billedTo:
        $ref: '#/definitions/bakehouse_services_admin_adminapi.InvoiceCustomerInput'
      branchId:
        type: string
      customerId:
        description: Required when kind is "customer".
        type: string
      discountCents:
        type: integer
      discountPct:
        description: |-
          A percentage or a flat amount, never both. The server works out the
          other one and stores it, so the document and the arithmetic agree.
        type: number
      isGift:
        description: InvoiceNumber *string `json:"invoiceNumber,omitempty"`
        type: boolean
      issuedDate:
        description: OrderID    string `json:"orderId,omitempty"`
        type: string
      items:
        items:
