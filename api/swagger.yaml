        (priced now from the store''s rules for the address, subtotal and slot). Optional
        body: the deliveryFeeCents / totalCents the storefront is showing; a difference
        fails validation with DELIVERY_FEE_CHANGED / TOTAL_CHANGED. Out of area fails
        with DELIVERY_UNAVAILABLE. The response carries the current summary.'
      parameters:
      - description: Guest cart token; omit when authenticated
        in: header
        name: X-Cart-Token
        type: string
      - description: What the storefront is showing (optional)
        in: body
        name: body
