                data:
                  $ref: '#/definitions/services_orders_internal_api.paymentLinkDTOType'
              type: object
        "422":
          description: NO_OPEN_LINK
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
      security:
      - BearerAuth: []
      summary: Cancel the payment link
      tags:
      - pos
    get:
      description: The most recent payment link for the order, in any status (open,
        paid, expired, cancelled).
      parameters:
      - description: orderId
        in: path
        name: orderId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/services_orders_internal_api.paymentLinkDTOType'
              type: object
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
      security:
      - BearerAuth: []
      summary: The order's payment link
      tags:
      - pos
    post:
      consumes:
      - application/json
      description: 'Opens a hosted card payment page (Stripe Checkout) for what is
        owed on the order — or on one split bill — and emails it to the customer.
        One open link per order: asking again with the same provider, amount, bill
        and email re-sends it (resent=true); anything different expires the old link
        at the provider first (replaced=true). When the customer pays, the provider''s
        webhook records the card payment (and settles the order when it covers the
        rest), and payment.completed is sent on /pos/events.'
      parameters:
      - description: orderId
        in: path
