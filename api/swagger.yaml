  /kds/events:
    get:
      description: 'text/event-stream of order changes for the location''s stores:
        order.created, order.updated, order.amended, order.status_changed, order.kot_status_changed,
        order.item.kot_status_changed, order.cancelled. Each data line is JSON {type,
        orderId, orderItemId, branchId, reference, status, kotStatus, at}. A browser
        EventSource may pass the token as ?accessToken=. A ": ping" comment is sent
        every 25 s.'
      parameters:
      - description: Access token (EventSource cannot set headers)
        in: query
        name: accessToken
        type: string
      - description: 'Central kitchen: one assigned store'
        in: query
        name: storeId
        type: string
      - description: 'Brand-wide staff: the store'
        in: query
        name: branchId
        type: string
      - description: 'Brand-wide staff: the central kitchen'
        in: query
        name: centralKitchenId
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: event stream
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: KDS live updates (Server-Sent Events)
      tags:
      - kds
  /kds/orders:
    get:
      description: Orders the kitchen should see, with counts for the filter chips.
        Queued tickets only appear once currentTime ≥ slot start − (orderAppearMinutes
        + the longest item max prep time), when the location's "show orders based
        on time" setting is on. Fulfilment types are limited by the location's showPickup
        / showDelivery / showTakeaway settings.
      parameters:
      - description: 'RFC3339 ''now'' used for the appear-time rule (default: server
          now)'
        in: query
        name: currentTime
        type: string
      - description: 'YYYY-MM-DD scheduled date from (default: today in the location''s
          timezone)'
        in: query
        name: startDate
        type: string
      - description: 'YYYY-MM-DD scheduled date to (default: startDate)'
        in: query
        name: endDate
        type: string
      - description: pickup, delivery, takeaway (comma-separated)
        in: query
        name: fulfilmentType
        type: string
      - description: Order status filter (comma-separated)
        in: query
        name: status
        type: string
      - description: Kitchen status filter (comma-separated)
        in: query
        name: kotStatus
        type: string
      - description: all (default), active, ready, fulfilled, cancelled, new, amended
        in: query
        name: view
        type: string
      - description: Apply the appear-time rule (default true)
        in: query
        name: applyAppearTime
        type: boolean
      - description: Also show unfinished orders from before startDate (default true)
        in: query
        name: includeOverdue
        type: boolean
      - description: Reference or name
        in: query
        name: search
        type: string
      - description: 'Central kitchen: narrow to one assigned store'
        in: query
        name: storeId
        type: string
      - description: 'Brand-wide staff: the store'
        in: query
        name: branchId
        type: string
      - description: 'Brand-wide staff: the central kitchen'
        in: query
        name: centralKitchenId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/services_orders_internal_api.kdsBoardDTO'
              type: object
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "403":
          description: PERMISSION_DENIED
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
      security:
      - BearerAuth: []
      summary: 'KDS board: orders for the signed-in location'
      tags:
