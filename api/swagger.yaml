      slotStart:
        description: The delivery slot's start ("HH:MM"), for charge-by-delivery-time
          rules.
        example: "14:00"
        type: string
      state:
        example: NJ
        type: string
      street:
        description: |-
          The delivery address. Street is optional for a ZIP-priced store and
          improves accuracy for a radius-priced one.
        example: 53 Wilk Rd
        type: string
      subtotalCents:
        description: |-
          Item subtotal before discounts, tip, tax and delivery: what "free over
          $X" rules compare against.
        example: 6800
        type: integer
    type: object
  services_orders_internal_api.posItemRequest:
    properties:
      batchNo:
        description: Which round this line is on. Omit and it goes on the next one.
        type: integer
      cancelTime:
        example: "2026-09-18T10:53:00Z"
        type: string
      comments:
        type: string
      discountCents:
        type: integer
      discountPct:
        type: number
      giftMessage:
        description: |-
          Gift message and occasion for this line. On an update: key omitted keeps
          the stored value; null or "" clears it; a string replaces it.
        example: Happy birthday!
        type: string
      giftReason:
        example: Birthday
        type: string
      id:
        description: |-
          Set for a line the order already has, so an update changes it rather
          than adding a second copy. Leave it out for a new line.
        type: string
      itemDiscountCents:
        type: integer
      itemDiscountPct:
        type: number
      kotStatus:
        description: |-
          KDS: the line's kitchen status. Omit on a new line (it joins the queue)
          and on an existing line to leave it as it is.
        example: queue
        type: string
      lineTotalCents:
        type: integer
      productId:
        type: string
      productName:
        type: string
      productionDoneAt:
        example: "2026-09-18T10:53:00Z"
        type: string
      productionStartedAt:
        example: "2026-09-18T10:53:00Z"
        type: string
      quantity:
        type: integer
      selectedAddons:
        items:
          $ref: '#/definitions/bakehouse_services_orders_ordersapi.SelectedModifierRef'
        type: array
      selectedFlavours:
        items:
          $ref: '#/definitions/bakehouse_services_orders_ordersapi.SelectedModifierRef'
        type: array
      sendKotTime:
        description: When the till sent it to the kitchen.
        example: "2026-09-18T10:53:00Z"
        type: string
      status:
        description: pending, in_progress, done, cancel, cancelled or returned.
        type: string
      unitPriceCents:
        type: integer
      variantId:
        type: string
      variantName:
        type: string
    type: object
  services_orders_internal_api.posOrderRequest:
    properties:
      branchId:
        example: br_123
        type: string
      customer:
        $ref: '#/definitions/services_orders_internal_api.posCustomerRequest'
      customerId:
        example: c0a80123-4567-89ab-cdef-0123456789ab
        type: string
      deliveryFeeCents:
        type: integer
      discountCents:
        type: integer
      discountPct:
        type: number
      fulfilmentType:
        example: pickup
        type: string
      giftMessage:
        description: Gift card message and occasion ("Birthday", "Sympathy"…), as
          on the storefront.
        example: Happy birthday, Amma!
        type: string
      giftReason:
        example: Birthday
        type: string
      guestCustomerAddress:
        example: 123 Flower Street
        type: string
      guestCustomerCity:
        example: Edison
        type: string
      guestCustomerEmail:
        example: guest@example.com
        type: string
      guestCustomerMobile:
        example: "+1234567890"
        type: string
      guestCustomerName:
        example: Jane Doe
        type: string
      guestCustomerPostcode:
        example: "08817"
        type: string
      isGift:
        description: '"Send as a gift". Omit to keep the default.'
        example: true
        type: boolean
      items:
        items:
          $ref: '#/definitions/services_orders_internal_api.posItemRequest'
        type: array
      kotStatus:
        description: |-
          KDS: the order's kitchen status at creation. Omit and it joins the
          queue.
        example: queue
        type: string
      markAmended:
        description: 'KDS: flag the new order "Amended" on the kitchen display.'
        type: boolean
      notes:
        type: string
      orderDeliverDate:
        example: "2026-09-07"
        type: string
      orderDeliverTime:
        example: "14:30:00"
        type: string
      recipient:
        allOf:
        - $ref: '#/definitions/services_orders_internal_api.posRecipientRequest'
        description: |-
          Who the order is for, as on the storefront. Omit and the recipient is
          the customer (the purchaser).
      scheduledDate:
        example: "2026-09-07"
        type: string
      serviceChargeCents:
        type: integer
      slotEnd:
        example: "14:30:00"
        type: string
      slotStart:
        example: "14:00:00"
        type: string
      status:
        example: confirmed
        type: string
      statusAt:
        example: "2026-09-16T10:33:52Z"
        type: string
      taxCents:
        type: integer
      taxPct:
        type: number
      tipCents:
        type: integer
    type: object
  services_orders_internal_api.posPaymentRequest:
    properties:
      amountCents:
        type: integer
      billId:
        description: Omit for a payment against the whole order rather than one share.
        type: string
      method:
        type: string
      paidAt:
        example: "2026-09-16T10:33:52Z"
        type: string
      reference:
        type: string
      serviceChargeCents:
        type: integer
      tenderedCents:
        type: integer
      tipCents:
        type: integer
    type: object
  services_orders_internal_api.posRecipientRequest:
    properties:
      address:
        description: The recipient's address — saved as the order's delivery address.
        example: 12 Elm Street
        type: string
      city:
        example: Edison
        type: string
      email:
        example: priya@example.com
        type: string
      firstName:
        example: Priya
        type: string
      lastName:
        example: Raman
        type: string
      phone:
        example: "+17325550123"
        type: string
      postcode:
        example: "08820"
        type: string
    type: object
  services_orders_internal_api.posReturnRequest:
    properties:
      discountCents:
        example: 150
        type: integer
      discountPct:
        description: |-
          Discount on the goods coming back. Cents wins over the percentage;
          omit both and the order's own discount is applied to what comes back.
        example: 10
        type: number
      fullReturn:
        type: boolean
      items:
        items:
          properties:
            orderItemId:
              type: string
            quantity:
              type: integer
          type: object
        type: array
      reason:
        type: string
      refund:
        allOf:
        - $ref: '#/definitions/services_orders_internal_api.returnRefundRequest'
        description: 'How the money goes back. Omitted: the return moves no money
          (as before).'
      returnedAt:
        example: "2026-09-16T10:33:52Z"
        type: string
      taxCents:
        example: 89
        type: integer
      taxPct:
        description: |-
          Tax on the goods coming back (after the discount). Cents wins over the
          percentage; omit both and the order's tax rate is used.
        example: 6.625
        type: number
    type: object
  services_orders_internal_api.posReturnResponse:
    properties:
      amountCents:
        description: |-
          Gross value of the goods (unit price × quantity). Kept as amountCents
          for existing clients.
        type: integer
      discountCents:
        type: integer
      discountPct:
        type: number
      grossAmountCents:
        type: integer
      items:
        description: |-
          Each item on this return with its own discount, tax and refund (item
          based); the fields above are their totals (return based).
        items:
          $ref: '#/definitions/services_orders_internal_api.orderReturnItemDTOType'
        type: array
      order:
        $ref: '#/definitions/services_orders_internal_api.orderDTOType'
      refund:
        allOf:
        - $ref: '#/definitions/services_orders_internal_api.returnRefundDTOType'
        description: The refund made, when the request asked for one.
      refundAmountCents:
        type: integer
      returnId:
        type: string
      taxCents:
        type: integer
      taxPct:
        type: number
    type: object
  services_orders_internal_api.posSplitRequest:
    properties:
      amounts:
        items:
          type: integer
        type: array
      groups:
        items:
          items:
            properties:
              orderItemId:
                type: string
              quantity:
                type: integer
            type: object
          type: array
        type: array
      labels:
        items:
          type: string
        type: array
      mode:
        type: string
      serviceChargeCents:
        description: |-
          The service charge chosen on the bill screen. Set on the order before
          it is split, so every share carries its part. Omitted: unchanged.
        example: 500
        type: integer
      ways:
        type: integer
    type: object
  services_orders_internal_api.posUpdateOrderRequest:
    properties:
      amendedAt:
        description: 'KDS: when it was amended (RFC3339). Defaults to statusAt, else
          now.'
        example: "2026-09-16T10:33:52Z"
        type: string
      customer:
        allOf:
        - $ref: '#/definitions/services_orders_internal_api.posCustomerRequest'
        description: |-
          Customer details. Written onto the customer record only when
          customerId is sent; without a customerId no customer record changes.
          The order's purchaser is then refreshed from that customer.
      customerId:
        example: c0a80123-4567-89ab-cdef-0123456789ab
        type: string
      deliveryFeeCents:
        type: integer
      discountCents:
        type: integer
      discountPct:
        type: number
      fulfilmentType:
        description: |-
          pickup, delivery or takeaway. Omit to keep it. Moving to delivery adds
          the outlet's delivery fee (moving off delivery removes it) unless
          deliveryFeeCents is sent.
        enum:
        - pickup
        - delivery
        - takeaway
        example: delivery
        type: string
      giftMessage:
        description: |-
          Gift message and occasion. Key omitted keeps the stored value; null or
          "" clears it; a string replaces it.
        example: Happy birthday, Amma!
        type: string
      giftReason:
        example: Birthday
        type: string
      guestCustomerAddress:
        example: 123 Flower Street
        type: string
      guestCustomerCity:
        example: Edison
        type: string
      guestCustomerEmail:
        example: guest@example.com
        type: string
      guestCustomerMobile:
        example: "+1234567890"
        type: string
      guestCustomerName:
        example: Jane Doe
        type: string
      guestCustomerPostcode:
        example: "08817"
        type: string
      isGift:
        description: '"Send as a gift". Omit to keep.'
        example: true
        type: boolean
      items:
        description: |-
          Lines with an id are updated, lines without are added. Anything not
          mentioned is left as it is, so a screen can send only what changed.
        items:
          $ref: '#/definitions/services_orders_internal_api.posItemRequest'
        type: array
      kotStatus:
        description: 'KDS: the order''s kitchen status, if the frontend is setting
          it.'
        example: queue
        type: string
      markAmended:
        description: |-
          KDS: flag the order "Amended" on the kitchen display (send true when the
          change matters to a kitchen that already has the ticket).
        type: boolean
      notes:
        type: string
      orderDeliverDate:
        example: "2026-09-07"
        type: string
      orderDeliverTime:
        example: "14:30:00"
        type: string
      recipient:
        allOf:
        - $ref: '#/definitions/services_orders_internal_api.posRecipientRequest'
        description: Who the order is for (storefront-style). Omit to keep it as it
          is.
      serviceChargeCents:
        type: integer
      status:
        description: Order status, if the till is moving it.
        type: string
      statusAt:
        example: "2026-09-16T10:33:52Z"
        type: string
      taxCents:
        type: integer
      taxPct:
        description: Change the rate the tax is computed at. Omit to keep the order's
          rate.
        type: number
      tipCents:
        type: integer
    type: object
  services_orders_internal_api.posUpdateOrderResponse:
    properties:
      batchNo:
        type: integer
      order:
        $ref: '#/definitions/services_orders_internal_api.orderDTOType'
    type: object
  services_orders_internal_api.priceSummaryDTOType:
    properties:
      currency:
        type: string
      deliveryAvailable:
        description: |-
          False when the store doesn't deliver to the cart's address (or none is
          set yet); deliveryMessage then says why. Always true for pickup.
        type: boolean
      deliveryFee:
        type: integer
      deliveryMessage:
        type: string
      discount:
        type: integer
      discountPct:
        type: number
      serviceCharge:
        type: integer
      subtotal:
        type: integer
      tax:
        type: integer
      taxName:
        type: string
      taxPct:
        type: number
      tip:
        type: integer
      total:
        type: integer
    type: object
  services_orders_internal_api.purchaserDTOType:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      phone:
        type: string
    type: object
  services_orders_internal_api.recipientNameDTOType:
    properties:
      address:
        description: |-
          The recipient's address under the same names the POS request uses.
          Always present (null when none); the order's delivery address.
        type: string
      businessName:
        type: string
      city:
        type: string
      deliveryAddressType:
        type: string
      deliveryCity:
        type: string
      deliveryInstructions:
        type: string
      deliveryPostcode:
        type: string
      deliveryState:
        type: string
      deliveryStreet:
        type: string
      email:
        description: |-
          The receiver's own address, distinct from purchaser.email. Null on the
          majority of orders, which only ever capture the purchaser's.
        type: string
      firstName:
        type: string
      lastName:
        type: string
      phone:
        type: string
      postcode:
        type: string
    type: object
  services_orders_internal_api.refundLineDTOType:
    properties:
      amountCents:
        type: integer
      paymentRef:
        type: string
      provider:
        type: string
      refundRef:
        type: string
      status:
        type: string
    type: object
  services_orders_internal_api.refundRequest:
    properties:
      amountCents:
        type: integer
      reason:
        type: string
      statusAt:
        example: "2026-09-16T10:33:52Z"
        type: string
    type: object
  services_orders_internal_api.returnChargesDTOType:
    properties:
      discountCents:
        type: integer
      discountPct:
        type: number
      grossAmountCents:
        type: integer
      refundAmountCents:
        type: integer
      taxCents:
        type: integer
      taxPct:
        type: number
    type: object
  services_orders_internal_api.returnRefundDTOType:
    properties:
      amountCents:
        type: integer
      cardType:
        type: string
      cashCents:
        description: Of amountCents, what to hand back in cash at the counter.
        type: integer
      lines:
        items:
          $ref: '#/definitions/services_orders_internal_api.refundLineDTOType'
        type: array
      paymentMode:
        type: string
      refundType:
        type: string
      status:
        description: |-
          succeeded | pending (settles by webhook: refund.completed / refund.failed
          on /pos/events) | manual (handed back at the counter)
        type: string
    type: object
  services_orders_internal_api.returnRefundRequest:
    properties:
      amountCents:
        example: 500
        type: integer
      cardType:
        description: |-
          stripe | manual (card only). Stripe refunds through the provider
          before the return is recorded; manual = own terminal.
        example: stripe
        type: string
      paymentMode:
        description: |-
          cash | card | original (back the way it was paid: Stripe
          payments first, the rest cash — for split payments)
        example: original
        type: string
      refundType:
        description: 'full (default): the return''s refund. partial: amountCents of
          it.'
        example: full
        type: string
    type: object
  services_orders_internal_api.saveRecipientRequest:
    properties:
      businessName:
        description: |-
          BusinessName is the company on the door; DeliveryAddressType is
          "residence" or "business".
        example: Acme Ltd
        type: string
      deliveryAddressType:
        enum:
        - residence
        - business
        example: business
        type: string
      deliveryCity:
        type: string
      deliveryInstructions:
        type: string
      deliveryPostcode:
        type: string
      deliveryState:
        type: string
      deliveryStreet:
        type: string
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      phone:
        type: string
    type: object
  services_orders_internal_api.scheduleConfigRequest:
    properties:
      advanceDaysMax:
        type: integer
      defaultLeadHours:
        type: integer
      deliveryCutoffTime:
        type: string
      maxOrdersPerSlot:
        type: integer
      pickupCutoffTime:
        type: string
      slotDurationMins:
        type: integer
    type: object
  services_orders_internal_api.setFulfilmentRequest:
    properties:
      address:
        type: string
      branchId:
        type: string
      city:
        type: string
      fulfilmentType:
        type: string
      postcode:
        type: string
      state:
        type: string
      street:
        type: string
    type: object
  services_orders_internal_api.setScheduleRequest:
    properties:
      date:
        type: string
      slotStart:
        type: string
    type: object
  services_orders_internal_api.setStatusRequest:
    properties:
      note:
        type: string
      status:
        type: string
      statusAt:
        example: "2026-09-16T10:33:52Z"
        type: string
    type: object
  services_orders_internal_api.setTipRequest:
    properties:
      fixedCents:
        type: integer
    type: object
  services_orders_internal_api.startingCashRequest:
    properties:
      amountCents:
        type: integer
      branchId:
        type: string
      businessDate:
        description: YYYY-MM-DD. Defaults to the outlet's today.
        type: string
      carryForward:
        description: |-
          The "apply the same amount daily" tick: later days nobody has opened
          inherit this float instead of starting at zero.
        type: boolean
    type: object
  services_orders_internal_api.timelineEventDTOType:
    properties:
      actor:
        type: string
      at:
        type: string
      note:
        type: string
      status:
        type: string
    type: object
  services_orders_internal_api.updateCartItemRequest:
    properties:
      giftMessage:
        type: string
      isGift:
        type: boolean
      quantity:
        type: integer
      recipient:
        properties:
          firstName:
            type: string
          lastName:
            type: string
        type: object
      selectedAddonIds:
        items:
          type: string
        type: array
      selectedFlavourIds:
        items:
          type: string
        type: array
      selectedPresentationId:
        type: string
      selectedWrapColourId:
        type: string
    type: object
  services_orders_internal_api.upliftCapacityRequest:
    properties:
      maxCapacity:
        type: integer
    type: object
  services_orders_internal_api.validateCartRequest:
    properties:
      deliveryFeeCents:
        example: 500
        type: integer
      totalCents:
        example: 7399
        type: integer
    type: object
  services_payments_internal_api.checkoutSessionResponse:
    properties:
      amountCents:
        example: 4208
        type: integer
      currency:
        example: GBP
        type: string
      id:
        example: cs_test_a1B2c3
        type: string
      paymentId:
        description: |-
          Empty until the customer has paid. The storefront sends it to
          POST /storefront/orders as payment.paymentId.
        example: pi_3PqRsT
        type: string
      paymentStatus:
        description: unpaid | paid
        example: paid
        type: string
      status:
        description: open | complete | expired
        example: complete
        type: string
      url:
        example: https://checkout.stripe.com/c/pay/cs_test_a1B2c3
        type: string
    type: object
  services_payments_internal_api.createCheckoutSessionRequest:
    properties:
      amountCents:
        example: 4208
        type: integer
      currency:
        example: GBP
        type: string
      email:
        description: Email prefills the receipt address on the payment page. Optional.
        example: tina@example.com
        type: string
      provider:
        description: 'Provider: "stripe" or omitted.'
        example: stripe
        type: string
      returnPath:
        description: |-
          ReturnPath is a path on the storefront — not a URL. The origin comes
          from STOREFRONT_BASE_URL on the server, so a caller cannot turn the
          return leg into an open redirect. Defaults to /checkout.
        example: /checkout
        type: string
    type: object
  services_payments_internal_api.providersResponse:
    properties:
      default:
        description: Used when a checkout session names no provider.
        type: string
      providers:
        description: Card providers configured on this server ("stripe"), or empty.
        items:
          type: string
        type: array
    type: object
  services_payments_internal_api.webhookAck:
    properties:
      received:
        example: true
        type: boolean
    type: object
info:
  contact: {}
  description: 'Multi-store ordering platform for bakeries: storefront, POS, kitchen
    display and back office.'
  title: emzo Bakehouse API
  version: "1.0"
paths:
  /account:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/services_identity_internal_api.deleteAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
      security:
      - BearerAuth: []
      summary: Delete the customer account
      tags:
      - account
  /account/addresses:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
      security:
      - BearerAuth: []
      summary: List saved addresses
      tags:
      - account
    post:
      consumes:
      - application/json
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/services_identity_internal_api.addressRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
      security:
      - BearerAuth: []
      summary: Add a saved address
      tags:
      - account
  /account/addresses/{addressId}:
    delete:
      parameters:
      - description: addressId
        in: path
        name: addressId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "400":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "404":
          description: NOT_FOUND
          schema:
