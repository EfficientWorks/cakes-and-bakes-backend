      - description: orderId
        in: path
        name: orderId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/services_orders_internal_api.orderDTOType'
              type: object
        "403":
          description: PERMISSION_DENIED
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/bakehouse_pkg_httpx.Envelope'
      security:
      - BearerAuth: []
      summary: Get one order at the till
      tags:
      - pos
    put:
      consumes:
      - application/json
      description: 'Everything that happens to an order after it is placed: more lines,
        a changed quantity, a line cancelled, a batch sent to the kitchen, a discount.
        Lines carrying an id are updated; lines without one are added; lines not mentioned
        are left alone. Nothing is deleted — a cancelled line keeps its place and
        stops counting, because the kitchen already has a docket with it on. Charges
        you do not send keep their stored value. fulfilmentType changes pickup / delivery
        / takeaway. With customerId, the customer object (or the guest fields) updates
        that customer''s record and the purchaser is refreshed from it; without customerId
        no customer record is changed. recipient sets who the order is for.'
      parameters:
      - description: orderId
        in: path
        name: orderId
        required: true
        type: string
      - description: Request body
